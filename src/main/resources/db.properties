# ===================================================================
# Database Configuration Properties (MySQL)
# ===================================================================
# NOTE: These values are ONLY used when the corresponding environment
# variables are NOT set.  In Railway, the MySQL plugin automatically
# injects MYSQLHOST / MYSQLPORT / MYSQLDATABASE / MYSQLUSER /
# MYSQLPASSWORD, which take priority over everything below.
# ===================================================================

# Local development fallback
db.driver=com.mysql.cj.jdbc.Driver
db.url=jdbc:mysql://localhost:3306/usermanagement_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
db.username=root
db.password=changeme

# HikariCP Connection Pool Settings
db.pool.maximumPoolSize=10
db.pool.minimumIdle=2
db.pool.idleTimeout=30000
db.pool.connectionTimeout=10000
db.pool.maxLifetime=1800000
